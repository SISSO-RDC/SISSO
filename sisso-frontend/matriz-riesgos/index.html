<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISSO — Matriz de Riesgos</title>
<link rel="stylesheet" href="../shared/estilos.css">
<style>
  .resumen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .resumen-item { text-align: center; border-radius: var(--r); padding: 12px 8px; }
  .resumen-item .numero { font-size: 22px; font-weight: 800; }
  .resumen-item .etiqueta { font-size: 11px; margin-top: 2px; }

  .heatmap-wrap { overflow-x: auto; margin-bottom: 22px; }
  .heatmap { border-collapse: collapse; }
  .heatmap th, .heatmap td { border: 1px solid var(--bd); text-align: center; padding: 0; }
  .heatmap th { font-size: 11px; color: var(--t3); font-weight: 700; padding: 6px 4px; }
  .heatmap td.celda { width: 56px; height: 44px; font-weight: 800; font-size: 15px; cursor: default; }
  .heatmap .eje-etiqueta { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; color: var(--t3); font-weight: 700; padding: 4px; }

  .tabla-matriz { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tabla-matriz th { text-align: left; padding: 8px 6px; font-size: 11px; font-weight: 700; color: var(--t3); border-bottom: 2px solid var(--bd); }
  .tabla-matriz td { padding: 8px 6px; border-bottom: 1px solid var(--bd); vertical-align: top; }
  .tabla-matriz tr:last-child td { border-bottom: none; }
  .nivel-chip { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; }

  .sisso-modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .sisso-modal-fondo.visible { display: flex; }
  .sisso-modal-caja { background: #fff; border-radius: 14px; padding: 24px; width: 640px; max-width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .fila-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .fila-campos .sisso-campo { margin-bottom: 0; }
</style>
</head>
<body>

<div id="sisso-app">
  <div class="sisso-tarjeta">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
      <div>
        <div class="sisso-tarjeta-titulo" style="margin-bottom:2px;">Matriz de Riesgos</div>
        <div class="sisso-tarjeta-subtitulo">Metodología IPER (Probabilidad × Consecuencia) — Resolución C.D. 513 IESS.</div>
      </div>
      <button class="sisso-boton" onclick="abrirModal()">+ Nuevo riesgo</button>
    </div>
    <div class="sisso-exito" id="exito-lista"></div>
    <div class="sisso-error" id="error-lista"></div>

    <div class="resumen-grid" id="resumen-grid"></div>

    <div class="heatmap-wrap">
      <table class="heatmap" id="heatmap"></table>
    </div>

    <div style="overflow-x:auto;">
      <table class="tabla-matriz">
        <thead>
          <tr><th>Peligro</th><th>Tipo</th><th>Puesto</th><th>P × C</th><th>Nivel</th><th>Responsable / plazo</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tabla-tbody">
          <tr><td colspan="7" class="sisso-cargando">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: crear/editar item -->
<div class="sisso-modal-fondo" id="modal-item">
  <div class="sisso-modal-caja">
    <div style="font-size:16px;font-weight:800;margin-bottom:16px;" id="titulo-modal">Nuevo riesgo</div>
    <div class="sisso-error" id="error-modal"></div>

    <div class="fila-campos" style="margin-bottom:12px;">
      <div class="sisso-campo"><label class="sisso-etiqueta">Puesto de trabajo (texto libre)</label><input id="m-puesto" class="sisso-input" placeholder="Ej: Operador de bodega"></div>
      <div class="sisso-campo"><label class="sisso-etiqueta">Proceso</label><input id="m-proceso" class="sisso-input"></div>
      <div class="sisso-campo"><label class="sisso-etiqueta">Actividad</label><input id="m-actividad" class="sisso-input"></div>
      <div class="sisso-campo"><label class="sisso-etiqueta">Tipo de peligro</label>
        <select id="m-tipo-peligro" class="sisso-select">
          <option value="fisico">Físico</option>
          <option value="mecanico">Mecánico</option>
          <option value="quimico">Químico</option>
          <option value="biologico">Biológico</option>
          <option value="ergonomico">Ergonómico</option>
          <option value="psicosocial">Psicosocial</option>
        </select>
      </div>
      <div class="sisso-campo"><label class="sisso-etiqueta">Trabajadores expuestos</label><input id="m-expuestos" type="number" min="0" class="sisso-input"></div>
    </div>

    <div class="sisso-campo"><label class="sisso-etiqueta">Peligro específico *</label><input id="m-peligro" class="sisso-input" placeholder="Ej: Ruido continuo > 85 dB"></div>
    <div class="sisso-campo"><label class="sisso-etiqueta">Riesgo potencial (el daño esperado)</label><textarea id="m-riesgo-potencial" class="sisso-textarea" placeholder="Ej: Hipoacusia inducida por ruido"></textarea></div>

    <div class="fila-campos" style="margin-bottom:12px;">
      <div class="sisso-campo">
        <label class="sisso-etiqueta">Probabilidad</label>
        <select id="m-probabilidad" class="sisso-select" onchange="actualizarPrevisualizacion()"></select>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta">Consecuencia</label>
        <select id="m-consecuencia" class="sisso-select" onchange="actualizarPrevisualizacion()"></select>
      </div>
    </div>
    <div id="previsualizacion-nivel" style="margin-bottom:14px;"></div>

    <div class="sisso-campo"><label class="sisso-etiqueta">Controles existentes</label><textarea id="m-controles-existentes" class="sisso-textarea"></textarea></div>
    <div class="sisso-campo"><label class="sisso-etiqueta">Controles adicionales recomendados</label><textarea id="m-controles-adicionales" class="sisso-textarea"></textarea></div>

    <div class="fila-campos">
      <div class="sisso-campo"><label class="sisso-etiqueta">Responsable del control</label><input id="m-responsable" class="sisso-input"></div>
      <div class="sisso-campo"><label class="sisso-etiqueta">Plazo del control</label><input id="m-plazo" type="date" class="sisso-input"></div>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
      <button class="sisso-boton secundario" onclick="cerrarModal()">Cancelar</button>
      <button class="sisso-boton" id="btn-guardar-modal" onclick="guardarItem()">Guardar</button>
    </div>
  </div>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="matriz-riesgos.js"></script>
</body>
</html>
