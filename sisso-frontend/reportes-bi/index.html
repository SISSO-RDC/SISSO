<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISSO — Reportes BI</title>
<link rel="stylesheet" href="../shared/estilos.css">
<style>
  .filtros-bi { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px; }
  .filtros-bi .sisso-campo { margin-bottom: 0; }
  .filtros-bi .sisso-select, .filtros-bi .sisso-input { min-width: 140px; padding: 8px 12px; }
  .btn-acciones { display: flex; gap: 8px; margin-left: auto; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .kpi-tarjeta { border: 1px solid var(--bd); border-radius: var(--r); padding: 16px; }
  .kpi-numero { font-size: 26px; font-weight: 800; }
  .kpi-etiqueta { font-size: 11.5px; color: var(--t3); margin-top: 2px; }

  .seccion-bi { margin-bottom: 30px; }
  .seccion-bi-titulo { font-size: 14.5px; font-weight: 800; color: var(--t1); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--bd); }
  .grid-graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .caja-grafico { border: 1px solid var(--bd); border-radius: var(--r); padding: 16px; }
  .caja-grafico-titulo { font-size: 12.5px; font-weight: 700; color: var(--t2); margin-bottom: 10px; }
  .caja-grafico canvas { max-height: 240px; }
  .sin-datos-mini { font-size: 12px; color: var(--t3); text-align: center; padding: 30px 0; }

  .nota-metodologica { font-size: 11px; color: var(--t3); font-style: italic; margin-top: 8px; }
</style>
</head>
<body>

<div id="sisso-app">
  <div class="sisso-tarjeta">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
      <div>
        <div class="sisso-tarjeta-titulo" style="margin-bottom:2px;">Reportes BI</div>
        <div class="sisso-tarjeta-subtitulo">Panorama consolidado de todos los módulos SSO — filtrable por período y área.</div>
      </div>
      <div class="btn-acciones">
        <button class="sisso-boton secundario" onclick="descargarExcel()">📊 Descargar Excel</button>
        <button class="sisso-boton secundario" onclick="descargarPdf()">📄 Descargar PDF</button>
      </div>
    </div>
    <div class="sisso-error" id="error-bi"></div>

    <!-- Filtros -->
    <div class="filtros-bi">
      <div class="sisso-campo">
        <label class="sisso-etiqueta">Período</label>
        <select id="f-periodo" class="sisso-select" onchange="cambiarPeriodo()">
          <option value="12m">Últimos 12 meses</option>
          <option value="anio">Año completo</option>
          <option value="trimestre">Trimestre</option>
          <option value="personalizado">Rango personalizado</option>
          <option value="todo">Todo el histórico</option>
        </select>
      </div>
      <div class="sisso-campo" id="campo-anio" style="display:none;">
        <label class="sisso-etiqueta">Año</label>
        <select id="f-anio" class="sisso-select" onchange="aplicarFiltrosBI()"></select>
      </div>
      <div class="sisso-campo" id="campo-trimestre" style="display:none;">
        <label class="sisso-etiqueta">Trimestre</label>
        <select id="f-trimestre" class="sisso-select" onchange="aplicarFiltrosBI()">
          <option value="1">T1 (Ene–Mar)</option>
          <option value="2">T2 (Abr–Jun)</option>
          <option value="3">T3 (Jul–Sep)</option>
          <option value="4">T4 (Oct–Dic)</option>
        </select>
      </div>
      <div class="sisso-campo" id="campo-desde" style="display:none;">
        <label class="sisso-etiqueta">Desde</label>
        <input id="f-desde" type="date" class="sisso-input" onchange="aplicarFiltrosBI()">
      </div>
      <div class="sisso-campo" id="campo-hasta" style="display:none;">
        <label class="sisso-etiqueta">Hasta</label>
        <input id="f-hasta" type="date" class="sisso-input" onchange="aplicarFiltrosBI()">
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta">Área</label>
        <select id="f-area" class="sisso-select" onchange="aplicarFiltrosBI()"><option value="">Todas</option></select>
      </div>
    </div>

    <div id="contenido-bi">
      <div class="sisso-cargando">Cargando reporte…</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="reportes-bi.js"></script>
</body>
</html>
