<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sisso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISSO — Mi Empresa</title>
<link rel="stylesheet" href="../shared/estilos.css">
<style>
  .fila-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .fila-campos .sisso-campo { margin-bottom: 0; }

  .resumen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 4px; }
  .resumen-item { text-align: center; border: 1px solid var(--bd); border-radius: var(--r); padding: 16px 10px; }
  .resumen-item .numero { font-size: 28px; font-weight: 800; color: var(--teal2); }
  .resumen-item .etiqueta { font-size: 11.5px; color: var(--t3); margin-top: 2px; }

  .logo-caja { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .logo-preview { width: 84px; height: 84px; border-radius: 12px; border: 1.5px dashed var(--bd2); display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg3); flex-shrink: 0; }
  .logo-preview img { width: 100%; height: 100%; object-fit: contain; }

  .datos-solo-lectura { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 4px; font-size: 13px; }
  .datos-solo-lectura div strong { display: block; font-size: 11px; color: var(--t3); font-weight: 600; margin-bottom: 2px; }

  /* ---- Lote B: configurador sectorial ("Perfil inteligente de empresa") ---- */
  .sector-caja { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    border: 1px solid var(--bd); border-radius: var(--r); padding: 16px; margin-bottom: 20px; }
  .sector-caja-info { display: flex; align-items: center; gap: 12px; }
  .sector-icono-grande { font-size: 30px; line-height: 1; }
  .sector-sin-configurar { font-size: 13px; color: var(--t3); }

  .sisso-modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .sisso-modal-fondo.visible { display: flex; }
  .sisso-modal-caja.ancha { background: #fff; border-radius: 14px; padding: 26px; width: 760px; max-width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }

  .pasos-indicador { display: flex; gap: 6px; margin-bottom: 20px; }
  .pasos-indicador div { flex: 1; height: 5px; border-radius: 3px; background: var(--bd); }
  .pasos-indicador div.hecho, .pasos-indicador div.actual { background: var(--teal2); }

  .sector-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; max-height: 380px; overflow-y: auto; padding: 2px; }
  .sector-card { border: 1.5px solid var(--bd); border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .sector-card:hover { border-color: var(--teal); }
  .sector-card.seleccionada { border-color: var(--teal); background: var(--teal3); font-weight: 600; }
  .sector-card .icono { font-size: 26px; display: block; margin-bottom: 6px; }
  .sector-card .etiqueta { font-size: 11.5px; line-height: 1.25; }

  .chip-checkbox { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--bd); border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin: 3px 6px 3px 0; }
  .chip-checkbox input { margin: 0; }
  .chip-checkbox:has(input:checked) { background: var(--teal3); border-color: var(--teal); color: var(--teal2); font-weight: 600; }

  .previsualizacion-grupo { margin-bottom: 16px; }
  .previsualizacion-grupo h4 { font-size: 12.5px; margin: 0 0 6px; color: var(--t2); }
  .previsualizacion-lista { display: flex; flex-wrap: wrap; gap: 6px; }
  .previsualizacion-lista span { background: var(--bg3); border: 1px solid var(--bd); border-radius: 8px; padding: 4px 9px; font-size: 11.5px; }

  .normativa-aviso { border: 1px dashed var(--bd2); border-radius: var(--r); padding: 12px 14px; font-size: 12.5px; color: var(--t3); background: var(--bg3); }
</style>
</head>
<body>

<div id="sisso-app">

  <div class="sisso-tarjeta" style="margin-bottom:16px;">
    <div class="sisso-tarjeta-titulo">Mi Empresa</div>
    <div class="sisso-tarjeta-subtitulo">Perfil de la organización y datos usados en los documentos generados por SISSO.</div>
    <div class="sisso-error" id="error-general"></div>
    <div id="contenido-empresa"><div class="sisso-cargando">Cargando…</div></div>
  </div>
</div>

<!-- Lote B: configurador inteligente de sector empresarial (Fase 3 del plan) -->
<div class="sisso-modal-fondo" id="modal-config-sectorial">
  <div class="sisso-modal-caja ancha">
    <div class="sisso-tarjeta-titulo" style="margin-bottom:2px;">Perfil inteligente de empresa</div>
    <div class="sisso-tarjeta-subtitulo" id="config-paso-subtitulo">Paso 1 de 6 — Sector de la empresa</div>
    <div class="pasos-indicador" id="config-pasos-indicador"></div>
    <div class="sisso-error" id="config-error"></div>
    <div id="config-contenido-paso"></div>
    <div style="display:flex; justify-content:space-between; margin-top:20px;">
      <button class="sisso-boton secundario" id="btn-config-cancelar" onclick="cerrarConfiguradorSectorial()">Cancelar</button>
      <div style="display:flex; gap:8px;">
        <button class="sisso-boton secundario" id="btn-config-atras" onclick="pasoAnteriorConfigurador()" style="display:none;">← Atrás</button>
        <button class="sisso-boton" id="btn-config-siguiente" onclick="pasoSiguienteConfigurador()">Siguiente →</button>
      </div>
    </div>
  </div>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="mi-empresa.js"></script>
<script src="configurador-sectorial.js"></script>
</body>
</html>
