<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISSO — Mi Empresa</title>
<link rel="stylesheet" href="../shared/estilos.css">
<style>
  .fila-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .fila-campos .sisso-campo { margin-bottom: 0; }

  .resumen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 4px; }
  .resumen-item { text-align: center; border: 1px solid var(--bd); border-radius: var(--r); padding: 16px 10px; }
  .resumen-item .numero { font-size: 28px; font-weight: 800; color: var(--teal2); }
  .resumen-item .etiqueta { font-size: 11.5px; color: var(--t3); margin-top: 2px; }

  .logo-caja { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .logo-preview { width: 84px; height: 84px; border-radius: 12px; border: 1.5px dashed var(--bd2); display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg3); flex-shrink: 0; }
  .logo-preview img { width: 100%; height: 100%; object-fit: contain; }

  .datos-solo-lectura { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 4px; font-size: 13px; }
  .datos-solo-lectura div strong { display: block; font-size: 11px; color: var(--t3); font-weight: 600; margin-bottom: 2px; }
</style>
</head>
<body>

<div id="sisso-app">

  <div class="sisso-tarjeta" style="margin-bottom:16px;">
    <div class="sisso-tarjeta-titulo">Mi Empresa</div>
    <div class="sisso-tarjeta-subtitulo">Perfil de la organización y datos usados en los documentos generados por SISSO.</div>
    <div class="sisso-error" id="error-general"></div>
    <div id="contenido-empresa"><div class="sisso-cargando">Cargando…</div></div>
  </div>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="mi-empresa.js"></script>
</body>
</html>
