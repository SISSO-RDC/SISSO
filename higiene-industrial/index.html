<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISSO — Higiene Industrial</title>
  <link rel="stylesheet" href="../shared/estilos.css">
  <style>
    .filtros-caja { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
    .filtros-caja .sisso-campo { margin-bottom: 0; min-width: 150px; }
    table.tabla-medic { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.tabla-medic th, table.tabla-medic td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--bd); }
    table.tabla-medic th { color: var(--t3); font-size: 10.5px; text-transform: uppercase; }
    table.tabla-medic tr { cursor: pointer; }
    table.tabla-medic tr:hover { background: var(--bg); }
    .modal-fondo { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
    .modal-fondo.visible { display: flex; }
    .modal-caja { background: #fff; border-radius: var(--r); padding: 20px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

<div id="sisso-app">

  <div class="sisso-tarjeta" id="caja-crear" style="display:none;margin-bottom:16px;">
    <div class="sisso-tarjeta-titulo">Registrar medición</div>
    <div class="sisso-error" id="error-crear"></div>
    <div class="sisso-exito" id="exito-crear"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-tipo">Tipo de medición *</label>
        <select id="c-tipo" class="sisso-select">
          <option value="ruido">Ruido</option>
          <option value="iluminacion">Iluminación</option>
          <option value="vibracion">Vibración</option>
          <option value="quimico">Agente químico</option>
          <option value="estres_termico">Estrés térmico</option>
          <option value="polvo">Polvo</option>
          <option value="radiacion">Radiación</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-criterio">Criterio de cumplimiento *</label>
        <select id="c-criterio" class="sisso-select">
          <option value="maximo">No superar el límite (ruido, químicos, vibración...)</option>
          <option value="minimo">No estar por debajo del límite (iluminación...)</option>
        </select>
      </div>
    </div>
    <div class="sisso-campo">
      <label class="sisso-etiqueta" for="c-area">Área *</label>
      <input id="c-area" class="sisso-input" placeholder="Ej: Línea de corte, Bodega">
    </div>
    <div class="sisso-campo">
      <label class="sisso-etiqueta" for="c-parametro">Parámetro medido *</label>
      <input id="c-parametro" class="sisso-input" placeholder="Ej: Nivel de presión sonora, Benceno">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-valor">Valor medido *</label>
        <input id="c-valor" type="number" step="0.001" class="sisso-input">
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-unidad">Unidad *</label>
        <input id="c-unidad" class="sisso-input" placeholder="dB(A), lux, ppm...">
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-limite">Límite permisible *</label>
        <input id="c-limite" type="number" step="0.001" class="sisso-input">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-equipo">Equipo utilizado</label>
        <input id="c-equipo" class="sisso-input">
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-norma">Norma / método de referencia</label>
        <input id="c-norma" class="sisso-input" placeholder="Ej: NTE INEN-ISO 9612">
      </div>
    </div>
    <div class="sisso-campo">
      <label class="sisso-etiqueta" for="c-fecha">Fecha de medición *</label>
      <input id="c-fecha" type="date" class="sisso-input">
    </div>
    <div class="sisso-campo">
      <label class="sisso-etiqueta" for="c-observaciones">Observaciones</label>
      <textarea id="c-observaciones" class="sisso-textarea"></textarea>
    </div>
    <button class="sisso-boton ancho-completo" id="btn-crear" data-on-click="crearMedicion()">Registrar medición</button>
  </div>

  <div class="sisso-tarjeta">
    <div class="sisso-tarjeta-titulo">Mediciones de higiene industrial</div>
    <div class="filtros-caja">
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="f-tipo">Tipo</label>
        <select id="f-tipo" class="sisso-select" data-on-change="cargarListado()">
          <option value="">Todos</option>
          <option value="ruido">Ruido</option>
          <option value="iluminacion">Iluminación</option>
          <option value="vibracion">Vibración</option>
          <option value="quimico">Agente químico</option>
          <option value="estres_termico">Estrés térmico</option>
          <option value="polvo">Polvo</option>
          <option value="radiacion">Radiación</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="f-cumple">Cumplimiento</label>
        <select id="f-cumple" class="sisso-select" data-on-change="cargarListado()">
          <option value="">Todos</option>
          <option value="true">Cumple</option>
          <option value="false">No cumple</option>
        </select>
      </div>
    </div>
    <div id="tabla-mediciones"><div class="sisso-cargando">Cargando…</div></div>
  </div>
</div>

<div class="modal-fondo" id="modal-fondo">
  <div class="modal-caja">
    <div class="sisso-tarjeta-titulo" id="modal-titulo">Medición</div>
    <div id="modal-cuerpo"></div>
    <div id="modal-generar-capa" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);">
      <div class="sisso-tarjeta-subtitulo" style="margin-bottom:8px;">Esta medición no cumple. Generar acción CAPA:</div>
      <div class="sisso-error" id="error-modal"></div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="m-responsable">Responsable *</label>
        <select id="m-responsable" class="sisso-select"><option value="">Cargando…</option></select>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="m-fecha-limite">Fecha límite *</label>
        <input id="m-fecha-limite" type="date" class="sisso-input">
      </div>
      <button class="sisso-boton ancho-completo" data-on-click="confirmarGenerarCapa()">Generar CAPA</button>
    </div>
    <button class="sisso-boton secundario ancho-completo" style="margin-top:10px;" data-on-click="cerrarModal()">Cerrar</button>
  </div>
</div>

<script src="../shared/csp-eventos.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="pagina.js"></script>
</body>
</html>
