<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISSO — Inspecciones</title>
  <link rel="stylesheet" href="../shared/estilos.css">
  <style>
    .filtros-caja { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
    .filtros-caja .sisso-campo { margin-bottom: 0; min-width: 150px; }
    .insp-item { border: 1px solid var(--bd); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
    .insp-item:hover { background: var(--bg); }
    .insp-cabecera { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .insp-meta { font-size: 11.5px; color: var(--t3); margin-top: 4px; }
    .item-fila { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--bd); border-radius: var(--r); margin-bottom: 6px; font-size: 12.5px; }
    .hallazgo-item { border: 1px solid var(--bd); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px; }
    .panel-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .panel-2col { grid-template-columns: 1fr; } }
    .modal-fondo { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
    .modal-fondo.visible { display: flex; }
    .modal-caja { background: #fff; border-radius: var(--r); padding: 20px; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

<div id="sisso-app">

  <!-- ======= LISTADO ======= -->
  <div id="vista-listado">
    <div class="sisso-tarjeta" id="caja-crear" style="display:none;margin-bottom:16px;">
      <div class="sisso-tarjeta-titulo">Programar nueva inspección</div>
      <div class="sisso-error" id="error-crear"></div>
      <div class="sisso-exito" id="exito-crear"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-tipo">Tipo</label>
          <select id="c-tipo" class="sisso-select">
            <option value="planeada">Planeada</option>
            <option value="no_planeada">No planeada</option>
          </select>
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-fecha">Fecha programada</label>
          <input id="c-fecha" type="date" class="sisso-input">
        </div>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-area">Área / lugar *</label>
        <input id="c-area" class="sisso-input" placeholder="Ej: Bodega, Planta 1, línea de corte">
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-inspector">Inspector *</label>
        <select id="c-inspector" class="sisso-select"><option value="">Cargando…</option></select>
      </div>
      <button class="sisso-boton ancho-completo" id="btn-crear" data-on-click="crearInspeccion()">Programar inspección</button>
    </div>

    <div class="sisso-tarjeta">
      <div class="sisso-tarjeta-titulo">Inspecciones</div>
      <div class="filtros-caja">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="f-estado">Estado</label>
          <select id="f-estado" class="sisso-select" data-on-change="cargarListado()">
            <option value="">Todos</option>
            <option value="programada">Programada</option>
            <option value="en_progreso">En progreso</option>
            <option value="completada">Completada</option>
          </select>
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="f-tipo">Tipo</label>
          <select id="f-tipo" class="sisso-select" data-on-change="cargarListado()">
            <option value="">Todos</option>
            <option value="planeada">Planeada</option>
            <option value="no_planeada">No planeada</option>
          </select>
        </div>
      </div>
      <div id="lista-inspecciones"><div class="sisso-cargando">Cargando…</div></div>
    </div>
  </div>

  <!-- ======= DETALLE ======= -->
  <div id="vista-detalle" style="display:none;">
    <button class="btn-mini" data-on-click="volverAlListado()" style="margin-bottom:12px;">← Volver al listado</button>

    <div class="sisso-tarjeta" style="margin-bottom:16px;">
      <div class="sisso-error" id="error-detalle"></div>
      <div class="sisso-exito" id="exito-detalle"></div>
      <div id="resumen-inspeccion"></div>
      <div id="cambiar-estado-caja" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);">
        <label class="sisso-etiqueta">Estado de la inspección</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <select id="d-estado" class="sisso-select" style="max-width:220px;">
            <option value="programada">Programada</option>
            <option value="en_progreso">En progreso</option>
            <option value="completada">Completada</option>
          </select>
          <button class="sisso-boton secundario" data-on-click="cambiarEstado()">Guardar</button>
        </div>
      </div>
    </div>

    <div class="panel-2col">
      <!-- Checklist -->
      <div class="sisso-tarjeta">
        <div class="sisso-tarjeta-titulo">Checklist</div>
        <div id="form-item-caja" style="display:none;margin-bottom:12px;">
          <div class="sisso-error" id="error-item"></div>
          <input type="text" id="i-item" class="sisso-input" placeholder="Ej: Extintores señalizados y accesibles" style="margin-bottom:8px;">
          <select id="i-cumple" class="sisso-select" style="margin-bottom:8px;">
            <option value="si">Cumple</option>
            <option value="no">No cumple</option>
            <option value="no_aplica">No aplica</option>
          </select>
          <input type="text" id="i-observacion" class="sisso-input" placeholder="Observación (opcional)" style="margin-bottom:8px;">
          <button class="sisso-boton secundario ancho-completo" data-on-click="agregarItem()">+ Agregar al checklist</button>
        </div>
        <div id="lista-items"><div class="sisso-vacio">Sin items todavía.</div></div>
      </div>

      <!-- Hallazgos -->
      <div class="sisso-tarjeta">
        <div class="sisso-tarjeta-titulo">Hallazgos</div>
        <div id="form-hallazgo-caja" style="display:none;margin-bottom:12px;">
          <div class="sisso-error" id="error-hallazgo"></div>
          <textarea id="h-descripcion" class="sisso-textarea" placeholder="Descripción del hallazgo (mínimo 10 caracteres)" style="margin-bottom:8px;"></textarea>
          <select id="h-gravedad" class="sisso-select" style="margin-bottom:8px;">
            <option value="baja">Baja</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
          </select>
          <button class="sisso-boton secundario ancho-completo" data-on-click="agregarHallazgo()">+ Agregar hallazgo</button>
        </div>
        <div id="lista-hallazgos"><div class="sisso-vacio">Sin hallazgos todavía.</div></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: generar CAPA desde hallazgo -->
<div class="modal-fondo" id="modal-fondo">
  <div class="modal-caja">
    <div class="sisso-tarjeta-titulo">Generar acción CAPA</div>
    <div class="sisso-error" id="error-modal"></div>
    <div class="sisso-campo">
      <label class="sisso-etiqueta" for="m-responsable">Responsable *</label>
      <select id="m-responsable" class="sisso-select"><option value="">Cargando…</option></select>
    </div>
    <div class="sisso-campo">
      <label class="sisso-etiqueta" for="m-fecha-limite">Fecha límite *</label>
      <input id="m-fecha-limite" type="date" class="sisso-input">
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="sisso-boton" style="flex:1;" data-on-click="confirmarGenerarCapa()">Generar CAPA</button>
      <button class="sisso-boton secundario" style="flex:1;" data-on-click="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<script src="../shared/csp-eventos.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="pagina.js"></script>
</body>
</html>
