<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISSO — Vigilancia de la Salud</title>
  <link rel="stylesheet" href="../shared/estilos.css">
  <style>
    .prog-item { border: 1px solid var(--bd); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
    .prog-item:hover { background: var(--bg); }
    .prog-cabecera { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .obs-item { border-left: 3px solid var(--teal2); padding: 8px 12px; margin-bottom: 8px; background: var(--bg); border-radius: 0 var(--r) var(--r) 0; }
    .obs-cifras { display: flex; gap: 14px; margin-top: 4px; font-size: 12px; color: var(--t2); }
    .aviso-agregado {
      background: var(--teal3); color: var(--teal2); padding: 12px 14px; border-radius: var(--r);
      font-size: 12.5px; margin-bottom: 14px; line-height: 1.5;
    }
  </style>
</head>
<body>

<div id="sisso-app">

  <div id="aviso-rol"></div>

  <!-- Solo medico: crear programa -->
  <div class="sisso-tarjeta" id="caja-crear-programa" style="display:none;margin-bottom:16px;">
    <div class="sisso-tarjeta-titulo">Nuevo programa de vigilancia</div>
    <div class="sisso-error" id="error-nuevo-programa"></div>
    <div class="sisso-exito" id="exito-nuevo-programa"></div>

    <div class="sisso-campo">
      <label class="sisso-etiqueta" for="np-nombre">Nombre *</label>
      <input id="np-nombre" class="sisso-input" placeholder="Ej: Vigilancia de ruido - planta 1">
    </div>
    <div class="sisso-campo">
      <label class="sisso-etiqueta" for="np-tipo-riesgo">Tipo de riesgo *</label>
      <select id="np-tipo-riesgo" class="sisso-select">
        <option value="ruido">Ruido</option>
        <option value="quimico">Químico</option>
        <option value="ergonomico">Ergonómico</option>
        <option value="biologico">Biológico</option>
        <option value="psicosocial">Psicosocial</option>
        <option value="otro">Otro</option>
      </select>
    </div>
    <div class="sisso-campo">
      <label class="sisso-etiqueta" for="np-tipo-examen">Tipo de examen asociado</label>
      <select id="np-tipo-examen" class="sisso-select">
        <option value="">— No aplica —</option>
        <option value="audiometria">Audiometría</option>
        <option value="espirometria">Espirometría</option>
        <option value="visiometria">Visiometría</option>
        <option value="evaluacion_periodica">Evaluación periódica</option>
        <option value="ergonomia">Ergonomía</option>
        <option value="ausentismo">Ausentismo</option>
        <option value="otro">Otro</option>
      </select>
    </div>
    <div class="sisso-campo">
      <label class="sisso-etiqueta" for="np-descripcion">Descripción</label>
      <textarea id="np-descripcion" class="sisso-textarea"></textarea>
    </div>
    <button class="sisso-boton ancho-completo" id="btn-crear-programa" data-on-click="crearPrograma()">Crear programa</button>
  </div>

  <div class="sisso-tarjeta">
    <div class="sisso-tarjeta-titulo">Programas de vigilancia</div>
    <div id="lista-programas"><div class="sisso-cargando">Cargando programas…</div></div>
  </div>

  <!-- Detalle de programa -->
  <div class="sisso-tarjeta" id="caja-detalle-programa" style="display:none;margin-top:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div class="sisso-tarjeta-titulo" id="titulo-programa" style="margin-bottom:0;">Programa</div>
      <button class="btn-mini" data-on-click="cerrarDetalleProgramaEl()">✕ Cerrar</button>
    </div>

    <!-- Solo medico: registrar observacion -->
    <div id="caja-nueva-observacion" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);">
      <div class="sisso-tarjeta-subtitulo">Registrar observación periódica</div>
      <div class="sisso-error" id="error-nueva-obs"></div>
      <div class="sisso-exito" id="exito-nueva-obs"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="no-periodo">Periodo *</label>
          <input id="no-periodo" class="sisso-input" placeholder="Ej: 2026-T3">
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="no-fecha">Fecha de corte *</label>
          <input id="no-fecha" type="date" class="sisso-input">
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="no-evaluados">Total evaluados *</label>
          <input id="no-evaluados" type="number" min="0" class="sisso-input">
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="no-hallazgo">Total con hallazgo *</label>
          <input id="no-hallazgo" type="number" min="0" class="sisso-input">
        </div>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="no-tendencia">Tendencia</label>
        <select id="no-tendencia" class="sisso-select">
          <option value="estable">Estable</option>
          <option value="mejora">Mejora</option>
          <option value="empeora">Empeora</option>
        </select>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="no-nota">Nota preventiva <span style="color:var(--t3);font-weight:400;">(agregada, nunca individual)</span></label>
        <textarea id="no-nota" class="sisso-textarea"></textarea>
      </div>
      <button class="sisso-boton secundario ancho-completo" data-on-click="registrarObservacion()">+ Registrar observación</button>
    </div>

    <div style="margin-top:14px;">
      <div class="sisso-tarjeta-subtitulo" style="margin-bottom:8px;">Histórico de observaciones</div>
      <div id="lista-observaciones"><div class="sisso-cargando">Cargando…</div></div>
    </div>
  </div>
</div>

<script src="../shared/csp-eventos.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="pagina.js"></script>
</body>
</html>
