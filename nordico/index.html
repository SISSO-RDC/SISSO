<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISSO — Cuestionario Nórdico</title>
<link rel="stylesheet" href="../shared/estilos.css">
<style>
  details.region { border: 1px solid var(--bd); border-radius: var(--r); margin-bottom: 10px; background: #fff; }
  details.region > summary { padding: 12px 16px; font-weight: 700; font-size: 13.5px; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; color: var(--t1); }
  details.region > summary::-webkit-details-marker { display: none; }
  details.region > summary::before { content: '▸ '; color: var(--teal); }
  details.region[open] > summary::before { content: '▾ '; }
  .region-cuerpo { padding: 4px 16px 16px; }

  .campos-detalle { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
  .campos-detalle .sisso-campo { margin-bottom: 0; }

  .escala-intensidad { display: flex; gap: 6px; margin-top: 4px; }
  .escala-intensidad button { flex: 1; padding: 8px 0; border: 1.5px solid var(--bd); border-radius: 8px; background: #fff; font-weight: 700; cursor: pointer; font-size: 13px; color: var(--t2); }
  .escala-intensidad button.activo { border-color: var(--teal); background: var(--teal3); color: var(--teal2); }

  .resumen-caja { border: 1px solid var(--bd); border-radius: var(--r); padding: 14px; margin-top: 14px; display: flex; gap: 20px; flex-wrap: wrap; }
  .resumen-item { text-align: center; }
  .resumen-item .numero { font-size: 22px; font-weight: 800; color: var(--t1); }
  .resumen-item .etiqueta { font-size: 11px; color: var(--t3); }

  .historial-item { border: 1px solid var(--bd); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>

<div id="sisso-app">

  <div class="sisso-tarjeta" id="caja-selector">
    <div class="sisso-tarjeta-titulo">Cuestionario Nórdico Estandarizado</div>
    <div class="sisso-tarjeta-subtitulo">Auto-reporte de síntomas músculo-esqueléticos (Kuorinka et al., 1987) — 9 zonas corporales.</div>
    <div class="sisso-error" id="error-selector"></div>
    <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
      <div class="sisso-campo" style="flex:1;min-width:260px;margin-bottom:0;">
        <label class="sisso-etiqueta" for="sel-trabajador">Trabajador</label>
        <select id="sel-trabajador" class="sisso-select"><option value="">Cargando trabajadores…</option></select>
      </div>
      <button class="sisso-boton" onclick="elegirTrabajador()">Continuar</button>
    </div>
  </div>

  <div id="caja-principal" style="display:none;margin-top:16px;">

    <div class="sisso-tarjeta" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div class="sisso-tarjeta-titulo" id="titulo-trabajador" style="margin-bottom:0;"></div>
        <button class="btn-mini" onclick="cambiarTrabajador()">← Cambiar trabajador</button>
      </div>
    </div>

    <div class="sisso-tarjeta" style="margin-bottom:16px;">
      <div class="sisso-tarjeta-titulo">Historial de aplicaciones</div>
      <div id="lista-historial"><div class="sisso-cargando">Cargando historial…</div></div>
    </div>

    <div class="sisso-tarjeta" style="margin-bottom:16px;">
      <div class="sisso-tarjeta-titulo">Nueva aplicación del cuestionario</div>
      <div class="sisso-error" id="error-form"></div>
      <div class="sisso-exito" id="exito-form"></div>

      <div class="sisso-campo" style="max-width:200px;">
        <label class="sisso-etiqueta" for="fecha-aplicacion">Fecha de aplicación</label>
        <input id="fecha-aplicacion" type="date" class="sisso-input">
      </div>

      <div id="caja-regiones"></div>

      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="observaciones-generales">Observaciones generales</label>
        <textarea id="observaciones-generales" class="sisso-textarea" placeholder="Notas adicionales sobre la aplicación del cuestionario…"></textarea>
      </div>

      <button class="sisso-boton ancho-completo" id="btn-guardar" onclick="guardarCuestionario()">Guardar cuestionario</button>

      <div id="caja-resultado"></div>
    </div>
  </div>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="nordico.js"></script>
</body>
</html>
