<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISSO — Iniciar sesión</title>
  <link rel="stylesheet" href="../shared/estilos.css">
  <style>
    /* Estilos especificos del login, que no necesitan vivir en estilos.css */
    /* CORREGIDO: logo de la organizacion (antes era un cuadrado con la
       letra "S"). Como el logo es un grafico horizontal, no un icono
       cuadrado, se muestra centrado y apilado sobre el texto en vez de
       en fila junto a el (ver sisso-login-logo mas abajo, que ya no
       esta en estilos.css sino aqui porque es especifico de esta
       pagina). */
    .sisso-login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
    }
    .sisso-login-logo-img {
      width: 130px;
      height: auto;
      margin-bottom: 4px;
    }
    .login-marca {
      font-size: 22px;
      font-weight: 900;
      color: var(--t1);
      letter-spacing: -0.5px;
    }
    .login-sub {
      font-size: 12px;
      color: var(--t3);
      text-align: center;
      margin: -10px 0 28px;
    }
    .campo-contrasena { position: relative; }
    .campo-contrasena .sisso-input { padding-right: 42px; }
    .ojo-contrasena {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--t3);
      padding: 2px;
    }
    .ojo-contrasena:hover { color: var(--t2); }
    .version {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,.35);
      margin-top: 18px;
    }
  </style>
</head>
<body>

<div class="sisso-login-pantalla">
  <div style="display:flex;flex-direction:column;align-items:center;">

    <div class="sisso-login-caja">
      <!-- Logo e identidad -->
      <div class="sisso-login-logo">
        <img src="../shared/logo.png" alt="SISSO" class="sisso-login-logo-img">
        <div class="login-marca">SISSO</div>
        <div style="font-size:11px;color:var(--t3);font-weight:600;margin-top:-8px;">Salud Ocupacional</div>
      </div>
      <div class="login-sub">Sistema Integral de Seguridad y Salud Ocupacional</div>

      <!-- Mensaje de error -->
      <div class="sisso-error" id="error-login"></div>

      <!-- Paso 1: correo + contrasena -->
      <div id="paso-credenciales">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            class="sisso-input"
            placeholder="tu@correo.com"
            autocomplete="email"
            autofocus
          >
        </div>

        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="contrasena">Contraseña</label>
          <div class="campo-contrasena">
            <input
              id="contrasena"
              type="password"
              class="sisso-input"
              placeholder="••••••••"
              autocomplete="current-password"
            >
            <button class="ojo-contrasena" type="button" onclick="alternarContrasena()" title="Mostrar/ocultar contraseña">
              👁
            </button>
          </div>
        </div>

        <button
          class="sisso-boton ancho-completo"
          id="btn-login"
          onclick="iniciarSesion()"
        >
          Iniciar sesión
        </button>
      </div>

      <!-- Paso 2: codigo de verificacion (solo si el usuario tiene MFA habilitado) -->
      <div id="paso-mfa" style="display:none;">
        <p style="font-size:12.5px;color:var(--t3);margin:0 0 16px;text-align:center;">
          Ingresa el código de 6 dígitos de tu app de autenticación.
        </p>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="codigo-mfa">Código de verificación</label>
          <input
            id="codigo-mfa"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            class="sisso-input"
            placeholder="000000"
            style="text-align:center;letter-spacing:6px;font-size:18px;"
            autocomplete="one-time-code"
            autofocus
          >
        </div>
        <button class="sisso-boton ancho-completo" id="btn-verificar-mfa" onclick="verificarMfa()">
          Verificar
        </button>
        <button class="sisso-boton secundario ancho-completo" style="margin-top:8px;" onclick="volverACredenciales()">
          Volver
        </button>
      </div>
    </div>

    <div class="version">SISSO v2.0 · Plataforma médico-ocupacional</div>
  </div>
</div>

<script src="../shared/api.js"></script>
<script>
  // Si ya hay una sesion activa, ir directamente al dashboard
  if (SissoSesion.haySesion()) {
    window.location.href = '../dashboard/index.html';
  }

  // Permitir hacer login con Enter en cualquier campo del formulario
  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('contrasena').focus();
  });
  document.getElementById('contrasena').addEventListener('keydown', e => {
    if (e.key === 'Enter') iniciarSesion();
  });

  function alternarContrasena() {
    const campo = document.getElementById('contrasena');
    campo.type = campo.type === 'password' ? 'text' : 'password';
  }

  function mostrarError(mensaje) {
    const el = document.getElementById('error-login');
    el.textContent = mensaje;
    el.classList.add('visible');
  }

  function ocultarError() {
    document.getElementById('error-login').classList.remove('visible');
  }

  let mfaTokenPendiente = null;

  async function iniciarSesion() {
    ocultarError();

    const email = document.getElementById('email').value.trim();
    const contrasena = document.getElementById('contrasena').value;
    const boton = document.getElementById('btn-login');

    if (!email || !contrasena) {
      mostrarError('Por favor ingresa tu correo y contraseña.');
      return;
    }

    boton.disabled = true;
    boton.textContent = 'Iniciando sesión…';

    try {
      const datos = await fetch('https://sissso-backend.onrender.com/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password: contrasena }),
      }).then(async (r) => {
        const cuerpo = await r.json();
        if (!r.ok) throw Object.assign(new Error(cuerpo.error || 'Error al iniciar sesión.'), { status: r.status });
        return cuerpo;
      });

      // Si el usuario tiene MFA habilitado, el backend no entrega
      // tokens todavia: pide el segundo factor primero.
      if (datos.requiereMfa) {
        mfaTokenPendiente = datos.mfaToken;
        document.getElementById('paso-credenciales').style.display = 'none';
        document.getElementById('paso-mfa').style.display = 'block';
        document.getElementById('codigo-mfa').value = '';
        document.getElementById('codigo-mfa').focus();
        return;
      }

      SissoSesion.guardar(datos);
      window.location.href = '../dashboard/index.html';

    } catch (err) {
      let mensaje = err.message || 'Error al conectar con el servidor.';
      if (err.status === 401) mensaje = 'Correo o contraseña incorrectos.';
      if (err.status === 423) mensaje = 'Cuenta bloqueada temporalmente por múltiples intentos fallidos. Intenta en unos minutos.';
      mostrarError(mensaje);
    } finally {
      boton.disabled = false;
      boton.textContent = 'Iniciar sesión';
    }
  }

  function volverACredenciales() {
    mfaTokenPendiente = null;
    ocultarError();
    document.getElementById('paso-mfa').style.display = 'none';
    document.getElementById('paso-credenciales').style.display = 'block';
    document.getElementById('contrasena').value = '';
  }

  async function verificarMfa() {
    ocultarError();
    const codigo = document.getElementById('codigo-mfa').value.trim();
    const boton = document.getElementById('btn-verificar-mfa');

    if (!codigo || codigo.length !== 6) {
      mostrarError('Ingresa el código de 6 dígitos.');
      return;
    }
    if (!mfaTokenPendiente) {
      mostrarError('La sesión de verificación expiró. Vuelve a ingresar tu contraseña.');
      volverACredenciales();
      return;
    }

    boton.disabled = true;
    boton.textContent = 'Verificando…';

    try {
      const datos = await fetch('https://sissso-backend.onrender.com/api/auth/mfa/verificar-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ mfaToken: mfaTokenPendiente, codigo }),
      }).then(async (r) => {
        const cuerpo = await r.json();
        if (!r.ok) throw Object.assign(new Error(cuerpo.error || 'Código incorrecto.'), { status: r.status });
        return cuerpo;
      });

      SissoSesion.guardar(datos);
      window.location.href = '../dashboard/index.html';

    } catch (err) {
      mostrarError(err.message || 'Código incorrecto.');
    } finally {
      boton.disabled = false;
      boton.textContent = 'Verificar';
    }
  }

  document.getElementById('codigo-mfa').addEventListener('keydown', e => {
    if (e.key === 'Enter') verificarMfa();
  });
</script>
</body>
</html>
