<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISSO — EPP</title>
  <link rel="stylesheet" href="../shared/estilos.css">
  <style>
    .filtros-caja { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
    .filtros-caja .sisso-campo { margin-bottom: 0; min-width: 150px; }
    table.tabla-epp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.tabla-epp th, table.tabla-epp td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--bd); }
    table.tabla-epp th { color: var(--t3); font-size: 10.5px; text-transform: uppercase; }
    #lienzo-firma-epp { border: 1px solid var(--bd); border-radius: var(--r); width: 100%; height: 140px; touch-action: none; background: #fff; }
    .tabs-epp { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab-epp { padding: 6px 14px; border-radius: 20px; font-size: 12.5px; cursor: pointer; background: var(--bg); color: var(--t2); }
    .tab-epp.activo { background: var(--teal2); color: #fff; }
  </style>
</head>
<body>

<div id="sisso-app">

  <div class="tabs-epp">
    <div class="tab-epp activo" id="tab-entregas" data-on-click="cambiarTab('entregas')">Entregas</div>
    <div class="tab-epp" id="tab-catalogo" data-on-click="cambiarTab('catalogo')">Catálogo</div>
  </div>

  <!-- ======= TAB ENTREGAS ======= -->
  <div id="vista-entregas">
    <div class="sisso-tarjeta" id="caja-crear-entrega" style="display:none;margin-bottom:16px;">
      <div class="sisso-tarjeta-titulo">Registrar entrega de EPP</div>
      <div class="sisso-error" id="error-entrega"></div>
      <div class="sisso-exito" id="exito-entrega"></div>

      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="e-trabajador">Trabajador *</label>
        <select id="e-trabajador" class="sisso-select"><option value="">Cargando…</option></select>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="e-epp">EPP *</label>
        <select id="e-epp" class="sisso-select"><option value="">Cargando…</option></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="e-fecha">Fecha de entrega *</label>
          <input id="e-fecha" type="date" class="sisso-input">
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="e-cantidad">Cantidad</label>
          <input id="e-cantidad" type="number" min="1" value="1" class="sisso-input">
        </div>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="e-motivo">Motivo</label>
        <select id="e-motivo" class="sisso-select">
          <option value="entrega_inicial">Entrega inicial</option>
          <option value="reposicion">Reposición</option>
          <option value="dano">Daño</option>
          <option value="vencimiento">Vencimiento</option>
        </select>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta">Firma de recibido (opcional)</label>
        <canvas id="lienzo-firma-epp"></canvas>
        <button class="btn-mini" style="margin-top:6px;" data-on-click="limpiarFirma()">Limpiar firma</button>
      </div>
      <button class="sisso-boton ancho-completo" id="btn-crear-entrega" data-on-click="crearEntrega()">Registrar entrega</button>
    </div>

    <div class="sisso-tarjeta">
      <div class="sisso-tarjeta-titulo">Entregas registradas</div>
      <div class="filtros-caja">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="f-estado">Estado</label>
          <select id="f-estado" class="sisso-select" data-on-change="cargarEntregas()">
            <option value="">Todos</option>
            <option value="vigente">Vigente</option>
            <option value="vencido">Vencido</option>
            <option value="repuesto">Repuesto</option>
          </select>
        </div>
      </div>
      <div id="tabla-entregas"><div class="sisso-cargando">Cargando…</div></div>
    </div>
  </div>

  <!-- ======= TAB CATALOGO ======= -->
  <div id="vista-catalogo" style="display:none;">
    <div class="sisso-tarjeta" id="caja-crear-catalogo" style="display:none;margin-bottom:16px;">
      <div class="sisso-tarjeta-titulo">Agregar EPP al catálogo</div>
      <div class="sisso-error" id="error-catalogo"></div>
      <div class="sisso-exito" id="exito-catalogo"></div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="k-nombre">Nombre *</label>
        <input id="k-nombre" class="sisso-input" placeholder="Ej: Casco de seguridad clase B">
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="k-tipo">Tipo *</label>
        <input id="k-tipo" class="sisso-input" placeholder="Ej: Protección craneal">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="k-vida-util">Vida útil (meses)</label>
          <input id="k-vida-util" type="number" min="1" class="sisso-input">
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="k-norma">Norma de referencia</label>
          <input id="k-norma" class="sisso-input" placeholder="Ej: ANSI Z89.1">
        </div>
      </div>
      <button class="sisso-boton ancho-completo" id="btn-crear-catalogo" data-on-click="crearItemCatalogo()">Agregar al catálogo</button>
    </div>

    <div class="sisso-tarjeta">
      <div class="sisso-tarjeta-titulo">Catálogo de EPP</div>
      <div id="lista-catalogo"><div class="sisso-cargando">Cargando…</div></div>
    </div>
  </div>
</div>

<script src="../shared/csp-eventos.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="pagina.js"></script>
</body>
</html>
