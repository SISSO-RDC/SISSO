<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISSO — Accidentes / Incidentes</title>
  <link rel="stylesheet" href="../shared/estilos.css">
  <style>
    .filtros-caja { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
    .filtros-caja .sisso-campo { margin-bottom: 0; min-width: 150px; }
    .caso-item { border: 1px solid var(--bd); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
    .caso-item:hover { background: var(--bg); }
    .caso-cabecera { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .caso-meta { font-size: 11.5px; color: var(--t3); margin-top: 4px; }
    .accion-item { border: 1px solid var(--bd); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px; }
    .accion-cabecera { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .accion-botones { display: flex; gap: 6px; margin-top: 8px; }
    .evidencia-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border: 1px solid var(--bd); border-radius: var(--r); margin-bottom: 6px; font-size: 12.5px; }
    .panel-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .panel-2col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div id="sisso-app">

  <!-- ======= LISTADO ======= -->
  <div id="vista-listado">
    <div class="sisso-tarjeta" id="caja-crear" style="display:none;margin-bottom:16px;">
      <div class="sisso-tarjeta-titulo">Reportar nuevo caso</div>
      <div class="sisso-error" id="error-crear"></div>
      <div class="sisso-exito" id="exito-crear"></div>

      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-tipo">Tipo *</label>
        <select id="c-tipo" class="sisso-select" data-on-change="alCambiarTipo()">
          <option value="accidente">Accidente</option>
          <option value="incidente">Incidente</option>
          <option value="casi_accidente">Casi accidente</option>
        </select>
      </div>
      <div class="sisso-campo" id="campo-trabajador">
        <label class="sisso-etiqueta" for="c-trabajador">Trabajador afectado *</label>
        <select id="c-trabajador" class="sisso-select"><option value="">Cargando trabajadores…</option></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-fecha">Fecha de ocurrencia *</label>
          <input id="c-fecha" type="date" class="sisso-input">
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-hora">Hora</label>
          <input id="c-hora" type="time" class="sisso-input">
        </div>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-lugar">Lugar *</label>
        <input id="c-lugar" class="sisso-input" placeholder="Ej: Planta 1, línea de corte">
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-descripcion">Descripción del evento * <span style="color:var(--t3);font-weight:400;">(mínimo 10 caracteres)</span></label>
        <textarea id="c-descripcion" class="sisso-textarea"></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-gravedad">Gravedad</label>
          <select id="c-gravedad" class="sisso-select">
            <option value="no_aplica">No aplica</option>
            <option value="leve">Leve</option>
            <option value="moderada">Moderada</option>
            <option value="grave">Grave</option>
            <option value="mortal">Mortal</option>
          </select>
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-dias-perdidos">Días perdidos</label>
          <input id="c-dias-perdidos" type="number" min="0" class="sisso-input" value="0">
        </div>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-tipo-lesion">Tipo de lesión <span style="color:var(--t3);font-weight:400;">(clasificación general, no diagnóstico)</span></label>
        <input id="c-tipo-lesion" class="sisso-input" placeholder="Ej: corte, contusión, quemadura">
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t2);margin-bottom:14px;">
        <input type="checkbox" id="c-atencion-medica"> Requiere atención médica (el caso clínico se registra aparte, en Historia Clínica)
      </label>
      <button class="sisso-boton ancho-completo" id="btn-crear" data-on-click="crearCaso()">Reportar caso</button>
    </div>

    <div class="sisso-tarjeta">
      <div class="sisso-tarjeta-titulo">Accidentes, incidentes y casi accidentes</div>
      <div class="filtros-caja">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="f-tipo">Tipo</label>
          <select id="f-tipo" class="sisso-select" data-on-change="cargarListado()">
            <option value="">Todos</option>
            <option value="accidente">Accidente</option>
            <option value="incidente">Incidente</option>
            <option value="casi_accidente">Casi accidente</option>
          </select>
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="f-estado">Estado</label>
          <select id="f-estado" class="sisso-select" data-on-change="cargarListado()">
            <option value="">Todos</option>
            <option value="reportado">Reportado</option>
            <option value="en_investigacion">En investigación</option>
            <option value="con_acciones">Con acciones</option>
            <option value="cerrado">Cerrado</option>
          </select>
        </div>
      </div>
      <div id="lista-casos"><div class="sisso-cargando">Cargando casos…</div></div>
    </div>
  </div>

  <!-- ======= DETALLE ======= -->
  <div id="vista-detalle" style="display:none;">
    <button class="btn-mini" data-on-click="volverAlListado()" style="margin-bottom:12px;">← Volver al listado</button>

    <div class="sisso-tarjeta" style="margin-bottom:16px;">
      <div class="sisso-error" id="error-detalle"></div>
      <div class="sisso-exito" id="exito-detalle"></div>
      <div id="resumen-caso"></div>
      <div id="acciones-caso-caja" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);">
        <label class="sisso-etiqueta">Cambiar estado del caso</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <select id="d-estado" class="sisso-select" style="max-width:220px;">
            <option value="reportado">Reportado</option>
            <option value="en_investigacion">En investigación</option>
            <option value="con_acciones">Con acciones</option>
            <option value="cerrado">Cerrado</option>
          </select>
          <button class="sisso-boton secundario" data-on-click="cambiarEstadoCaso()">Guardar estado</button>
        </div>
      </div>
    </div>

    <div class="panel-2col">
      <!-- Investigación -->
      <div class="sisso-tarjeta">
        <div class="sisso-tarjeta-titulo">Investigación</div>
        <div id="investigacion-existente"></div>
        <div id="form-investigacion-caja" style="display:none;margin-top:10px;">
          <div class="sisso-error" id="error-investigacion"></div>
          <div class="sisso-campo">
            <label class="sisso-etiqueta" for="i-metodo">Método de investigación</label>
            <input id="i-metodo" class="sisso-input" placeholder="Ej: Árbol de causas, 5 porqués">
          </div>
          <div class="sisso-campo">
            <label class="sisso-etiqueta" for="i-causas-inmediatas">Causas inmediatas *</label>
            <textarea id="i-causas-inmediatas" class="sisso-textarea" placeholder="Actos y condiciones subestándar directas."></textarea>
          </div>
          <div class="sisso-campo">
            <label class="sisso-etiqueta" for="i-causas-basicas">Causas básicas *</label>
            <textarea id="i-causas-basicas" class="sisso-textarea" placeholder="Factores personales y del trabajo de fondo."></textarea>
          </div>
          <div class="sisso-campo">
            <label class="sisso-etiqueta" for="i-factores">Factores contribuyentes</label>
            <textarea id="i-factores" class="sisso-textarea"></textarea>
          </div>
          <div class="sisso-campo">
            <label class="sisso-etiqueta" for="i-fecha">Fecha de investigación *</label>
            <input id="i-fecha" type="date" class="sisso-input">
          </div>
          <button class="sisso-boton ancho-completo" data-on-click="guardarInvestigacion()">Guardar investigación</button>
        </div>
      </div>

      <!-- Evidencia -->
      <div class="sisso-tarjeta">
        <div class="sisso-tarjeta-titulo">Evidencia</div>
        <div id="form-evidencia-caja" style="display:none;margin-bottom:12px;">
          <div class="sisso-error" id="error-evidencia"></div>
          <input type="file" id="e-archivo" accept="image/*,video/*" class="sisso-input" style="margin-bottom:8px;">
          <input type="text" id="e-descripcion" class="sisso-input" placeholder="Descripción breve (opcional)" style="margin-bottom:8px;">
          <button class="sisso-boton secundario ancho-completo" data-on-click="subirEvidencia()">Subir evidencia</button>
        </div>
        <div id="lista-evidencias"><div class="sisso-vacio">Sin evidencia todavía.</div></div>
      </div>
    </div>

    <!-- Acciones -->
    <div class="sisso-tarjeta" style="margin-top:16px;">
      <div class="sisso-tarjeta-titulo">Acciones correctivas / preventivas</div>
      <div id="form-accion-caja" style="display:none;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--bd);">
        <div class="sisso-error" id="error-accion"></div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="a-descripcion">Descripción de la acción *</label>
          <textarea id="a-descripcion" class="sisso-textarea"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="sisso-campo">
            <label class="sisso-etiqueta" for="a-responsable">Responsable *</label>
            <select id="a-responsable" class="sisso-select"><option value="">Cargando…</option></select>
          </div>
          <div class="sisso-campo">
            <label class="sisso-etiqueta" for="a-fecha-limite">Fecha límite *</label>
            <input id="a-fecha-limite" type="date" class="sisso-input">
          </div>
        </div>
        <button class="sisso-boton secundario ancho-completo" data-on-click="crearAccion()">+ Agregar acción</button>
      </div>
      <div id="lista-acciones"><div class="sisso-vacio">Sin acciones registradas.</div></div>
    </div>
  </div>
</div>

<script src="../shared/csp-eventos.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="pagina.js"></script>
</body>
</html>
