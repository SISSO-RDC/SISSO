<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISSO — CAPA</title>
  <link rel="stylesheet" href="../shared/estilos.css">
  <style>
    .filtros-caja { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
    .filtros-caja .sisso-campo { margin-bottom: 0; min-width: 150px; }
    .capa-item { border: 1px solid var(--bd); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
    .capa-item:hover { background: var(--bg); }
    .capa-item.vencida { border-left: 3px solid var(--red2); }
    .capa-cabecera { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .capa-meta { font-size: 11.5px; color: var(--t3); margin-top: 4px; }
    .flujo-pasos { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
    .flujo-paso { padding: 5px 10px; border-radius: 20px; font-size: 11px; background: var(--bg); color: var(--t3); }
    .flujo-paso.activo { background: var(--teal3); color: var(--teal2); font-weight: 600; }
    .flujo-paso.hecho { background: var(--grn3); color: var(--grn2); }
  </style>
</head>
<body>

<div id="sisso-app">

  <!-- ======= LISTADO ======= -->
  <div id="vista-listado">
    <div class="sisso-tarjeta" id="caja-crear" style="display:none;margin-bottom:16px;">
      <div class="sisso-tarjeta-titulo">Nueva acción CAPA</div>
      <div class="sisso-error" id="error-crear"></div>
      <div class="sisso-exito" id="exito-crear"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-origen-tipo">Origen</label>
          <select id="c-origen-tipo" class="sisso-select">
            <option value="manual">Manual</option>
            <option value="accidente">Accidente</option>
            <option value="casi_accidente">Casi accidente</option>
            <option value="matriz_riesgo">Matriz de riesgos</option>
            <option value="inspeccion">Inspección</option>
            <option value="enfermedad_profesional">Enfermedad profesional</option>
            <option value="auditoria">Auditoría</option>
          </select>
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-tipo">Tipo</label>
          <select id="c-tipo" class="sisso-select">
            <option value="correctiva">Correctiva</option>
            <option value="preventiva">Preventiva</option>
          </select>
        </div>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-origen-descripcion">Contexto del origen <span style="color:var(--t3);font-weight:400;">(opcional, ej: "Accidente #12 - corte en mano")</span></label>
        <input id="c-origen-descripcion" class="sisso-input">
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-hallazgo">Hallazgo / problema detectado * <span style="color:var(--t3);font-weight:400;">(mínimo 10 caracteres)</span></label>
        <textarea id="c-hallazgo" class="sisso-textarea"></textarea>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-accion">Acción a implementar * <span style="color:var(--t3);font-weight:400;">(mínimo 5 caracteres)</span></label>
        <textarea id="c-accion" class="sisso-textarea"></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-responsable">Responsable *</label>
          <select id="c-responsable" class="sisso-select"><option value="">Cargando…</option></select>
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-fecha-limite">Fecha límite *</label>
          <input id="c-fecha-limite" type="date" class="sisso-input">
        </div>
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-fecha-eficacia">Fecha planeada para revisar eficacia <span style="color:var(--t3);font-weight:400;">(opcional)</span></label>
        <input id="c-fecha-eficacia" type="date" class="sisso-input">
      </div>
      <button class="sisso-boton ancho-completo" id="btn-crear" data-on-click="crearCapa()">Crear acción CAPA</button>
    </div>

    <div class="sisso-tarjeta">
      <div class="sisso-tarjeta-titulo">Acciones correctivas y preventivas</div>
      <div class="filtros-caja">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="f-estado">Estado</label>
          <select id="f-estado" class="sisso-select" data-on-change="cargarListado()">
            <option value="">Todos</option>
            <option value="pendiente">Pendiente</option>
            <option value="en_progreso">En progreso</option>
            <option value="implementada">Implementada</option>
            <option value="verificada">Verificada</option>
            <option value="eficaz">Eficaz</option>
            <option value="no_eficaz">No eficaz</option>
            <option value="cerrada">Cerrada</option>
          </select>
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="f-origen">Origen</label>
          <select id="f-origen" class="sisso-select" data-on-change="cargarListado()">
            <option value="">Todos</option>
            <option value="manual">Manual</option>
            <option value="accidente">Accidente</option>
            <option value="casi_accidente">Casi accidente</option>
            <option value="matriz_riesgo">Matriz de riesgos</option>
            <option value="inspeccion">Inspección</option>
            <option value="enfermedad_profesional">Enfermedad profesional</option>
            <option value="auditoria">Auditoría</option>
          </select>
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t2);">
          <input type="checkbox" id="f-vencidas" data-on-change="cargarListado()"> Solo vencidas
        </label>
      </div>
      <div id="lista-capa"><div class="sisso-cargando">Cargando…</div></div>
    </div>
  </div>

  <!-- ======= DETALLE ======= -->
  <div id="vista-detalle" style="display:none;">
    <button class="btn-mini" data-on-click="volverAlListado()" style="margin-bottom:12px;">← Volver al listado</button>

    <div class="sisso-tarjeta">
      <div class="sisso-error" id="error-detalle"></div>
      <div class="sisso-exito" id="exito-detalle"></div>
      <div id="resumen-capa"></div>

      <div class="flujo-pasos" id="flujo-pasos"></div>

      <div id="acciones-transicion" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);"></div>
    </div>
  </div>
</div>

<script src="../shared/csp-eventos.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="pagina.js"></script>
</body>
</html>
