<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISSO — Alertas</title>
<link rel="stylesheet" href="../shared/estilos.css">
<style>
  .categoria-tarjeta { border: 1px solid var(--bd); border-radius: var(--r); margin-bottom: 14px; overflow: hidden; }
  .categoria-cabecera { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: var(--bg3); }
  .categoria-titulo { font-weight: 700; font-size: 13.5px; }
  .categoria-contador { background: var(--red2); color: #fff; border-radius: 12px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
  .alerta-item { padding: 10px 16px; border-top: 1px solid var(--bd); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; cursor: pointer; }
  .alerta-item:hover { background: var(--bg3); }
  .alerta-info strong { font-size: 13px; }
  .alerta-detalle { font-size: 11.5px; color: var(--t3); margin-top: 2px; }

  .todo-bien { text-align: center; padding: 40px 20px; color: var(--t3); }
</style>
</head>
<body>

<div id="sisso-app">
  <div class="sisso-tarjeta">
    <div class="sisso-tarjeta-titulo">Alertas</div>
    <div class="sisso-tarjeta-subtitulo">Panel consolidado de situaciones que requieren atención, calculado en tiempo real sobre los módulos del sistema.</div>
    <div class="sisso-error" id="error-general"></div>
    <div id="contenido-alertas"><div class="sisso-cargando">Cargando…</div></div>
  </div>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="alertas.js"></script>
</body>
</html>
