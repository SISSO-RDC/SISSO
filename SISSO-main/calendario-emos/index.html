<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISSO — Calendario EMOs</title>
<link rel="stylesheet" href="../shared/estilos.css">
<style>
  .resumen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .resumen-item { text-align: center; border: 1.5px solid var(--bd); border-radius: var(--r); padding: 12px 8px; cursor: pointer; background: #fff; transition: border-color .15s; }
  .resumen-item.activo { border-color: var(--teal); }
  .resumen-item .numero { font-size: 22px; font-weight: 800; }
  .resumen-item .etiqueta { font-size: 11px; color: var(--t3); margin-top: 2px; }

  .tabla-emos { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tabla-emos th { text-align: left; padding: 10px 8px; font-size: 11px; font-weight: 700; color: var(--t3); border-bottom: 2px solid var(--bd); }
  .tabla-emos td { padding: 10px 8px; border-bottom: 1px solid var(--bd); }
  .tabla-emos tr:last-child td { border-bottom: none; }

  .punto-urgencia { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }

  .filtros-caja { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .filtros-caja input { flex: 1; min-width: 180px; }
</style>
</head>
<body>

<div id="sisso-app">
  <div class="sisso-tarjeta">
    <div class="sisso-tarjeta-titulo">Calendario EMOs — Próximos exámenes</div>
    <div class="sisso-tarjeta-subtitulo">Vencimientos de exámenes médicos ocupacionales por trabajador.</div>
    <div class="sisso-error" id="error-general"></div>

    <div class="resumen-grid" id="resumen-grid"></div>

    <div class="filtros-caja">
      <input id="buscar" class="sisso-input" placeholder="Buscar por nombre o documento…" oninput="filtrarYRenderizar()">
    </div>

    <div style="overflow-x:auto;">
      <table class="tabla-emos">
        <thead>
          <tr><th>Trabajador</th><th>Área / Puesto</th><th>Última EMO</th><th>Vence</th><th>Estado</th></tr>
        </thead>
        <tbody id="tabla-tbody">
          <tr><td colspan="5" class="sisso-cargando">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="calendario-emos.js"></script>
</body>
</html>
