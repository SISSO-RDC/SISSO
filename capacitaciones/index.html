<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://sissso-backend.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISSO — Capacitaciones</title>
  <link rel="stylesheet" href="../shared/estilos.css">
  <style>
    .cap-item { border: 1px solid var(--bd); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
    .cap-item:hover { background: var(--bg); }
    .cap-cabecera { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cap-meta { font-size: 11.5px; color: var(--t3); margin-top: 4px; }
    .checklist-trabajadores { max-height: 260px; overflow-y: auto; border: 1px solid var(--bd); border-radius: var(--r); padding: 8px; margin-bottom: 12px; }
    .checklist-fila { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 12.5px; }
    table.tabla-asist { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.tabla-asist th, table.tabla-asist td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--bd); }
    table.tabla-asist th { color: var(--t3); font-size: 10.5px; text-transform: uppercase; }
  </style>
</head>
<body>

<div id="sisso-app">

  <!-- ======= LISTADO ======= -->
  <div id="vista-listado">
    <div class="sisso-tarjeta" id="caja-crear" style="display:none;margin-bottom:16px;">
      <div class="sisso-tarjeta-titulo">Registrar capacitación</div>
      <div class="sisso-error" id="error-crear"></div>
      <div class="sisso-exito" id="exito-crear"></div>
      <div id="nota-instructor" style="display:none;margin-bottom:10px;font-size:12px;color:var(--t3);"></div>

      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-nombre">Nombre *</label>
        <input id="c-nombre" class="sisso-input" placeholder="Ej: Inducción en seguridad y salud ocupacional">
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-tema">Tema</label>
        <input id="c-tema" class="sisso-input">
      </div>
      <div class="sisso-campo">
        <label class="sisso-etiqueta" for="c-instructor">Instructor</label>
        <input id="c-instructor" class="sisso-input">
      </div>
      <!-- CREADO en Auditoria N.15 (pedido de la persona usuaria: "los
           certificados deben ser firmados además por la persona que
           capacitó al personal sea el médico o el sso"). El backend ya
           aceptaba instructorUsuarioId de un gestor (admin/sso/th) si lo
           enviaba explícitamente -- lo que faltaba era la forma de
           enviarlo desde este formulario. Solo se ofrece a médico/sso
           (los 2 roles que el pedido menciona como quienes firman); admin
           y th siguen siendo gestores puros que no firman certificados. -->
      <div class="sisso-campo" id="caja-autoinstructor" style="display:none;">
        <label style="display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--t2);cursor:pointer;">
          <input type="checkbox" id="c-yo-dicte" style="margin-top:2px;">
          <span>Yo dicté esta capacitación (quedaré vinculado como instructor y mi firma/registro SENESCYT aparecerán en el certificado)</span>
        </label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-fecha">Fecha *</label>
          <input id="c-fecha" type="date" class="sisso-input">
        </div>
        <div class="sisso-campo">
          <label class="sisso-etiqueta" for="c-horas">Horas de duración *</label>
          <input id="c-horas" type="number" min="1" step="0.5" class="sisso-input">
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;flex-wrap:wrap;gap:6px;">
        <div class="sisso-tarjeta-subtitulo">Asistentes</div>
        <div style="display:flex;gap:12px;align-items:center;font-size:12px;">
          <label style="display:flex;align-items:center;gap:5px;cursor:pointer;">
            <input type="checkbox" id="chk-seleccionar-todos">
            Seleccionar todos
          </label>
          <button type="button" class="btn-mini" id="btn-deseleccionar-todos">Deseleccionar todos</button>
        </div>
      </div>
      <div class="checklist-trabajadores" id="checklist-trabajadores"><div class="sisso-cargando">Cargando trabajadores…</div></div>
      <button class="sisso-boton ancho-completo" id="btn-crear" data-on-click="crearCapacitacion()">Registrar capacitación</button>
    </div>

    <div class="sisso-tarjeta">
      <div class="sisso-tarjeta-titulo">Capacitaciones</div>
      <div id="lista-capacitaciones"><div class="sisso-cargando">Cargando…</div></div>
    </div>
  </div>

  <!-- ======= DETALLE ======= -->
  <div id="vista-detalle" style="display:none;">
    <button class="btn-mini" data-on-click="volverAlListado()" style="margin-bottom:12px;">← Volver al listado</button>

    <div class="sisso-tarjeta" style="margin-bottom:16px;">
      <div class="sisso-error" id="error-detalle"></div>
      <div id="resumen-capacitacion"></div>
      <div id="boton-eliminar" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);">
        <button class="sisso-boton secundario" data-on-click="eliminarCapacitacion()">🗑 Eliminar capacitación</button>
      </div>
    </div>

    <div class="sisso-tarjeta">
      <div class="sisso-tarjeta-titulo">Asistentes y certificados</div>
      <div id="tabla-asistentes"><div class="sisso-cargando">Cargando…</div></div>
    </div>
  </div>
</div>

<script src="../shared/csp-eventos.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/layout.js"></script>
<script src="pagina.js"></script>
</body>
</html>
